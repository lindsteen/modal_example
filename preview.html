import { cx } from '@/lib/cx';
import { Icon, type IconName } from '@/components/Icon/Icon';
import type { TextSize } from '@/components/Text/Text';

export type ButtonBg = 'primary' | 'white' | 'black' | 'transparent';
export type ButtonSize = 'sm' | 'md';
export type ButtonShape = 'pill' | 'rounded';
/** normal = fyldt baggrund. inverted = hvid baggrund med kant og tekst i farven. */
export type ButtonVariant = 'normal' | 'inverted';

export interface ButtonProps extends Omit<ButtonHTMLAttributes<HTMLButtonElement>, 'children'> {
  children: ReactNode;
  bg?: ButtonBg;
  size?: ButtonSize;
  shape?: ButtonShape;
  variant?: ButtonVariant;
  /** Standard: sm-knapper har 14 px tekst, md-knapper 16 px. */
  textSize?: TextSize;
  uppercase?: boolean;
  underlined?: boolean;
  fullWidth?: boolean;
  icon?: IconName;
  iconPosition?: 'start' | 'end';
}

/**
 * Knap med MRK's variant-klasser, fx \`button text-md bg-primary size-md pill button-normal\`.
 *
 * Designsystemets knaptyper:
 * - Prim\xE6r:   bg="primary" variant="normal"
 * - Sekund\xE6r: bg="primary" variant="inverted"
 * - Terti\xE6r:  bg="black"   variant="inverted"
 */
export function Button({
  children,
  bg = 'primary',
  size = 'md',
  shape = 'pill',
  variant = 'normal',
  textSize,
  uppercase = false,
  underlined = false,
  fullWidth = false,
  icon,
  iconPosition = 'start',
  type = 'button',
  className,
  ...rest
}: ButtonProps) {
  const iconElement = icon ? <Icon name={icon} size={size === 'sm' ? 'small' : 'medium'} /> : null;

  return (
    <button
      type={type}
      className={cx(
        'button',
        \`text-\${textSize ?? (size === 'sm' ? 'sm' : 'md')}\`,
        \`bg-\${bg}\`,
        \`size-\${size}\`,
        uppercase && 'uppercase',
        underlined && 'underlined',
        shape,
        \`button-\${variant}\`,
        fullWidth && 'full-width',
        className,
      )}
      {...rest}
    >
      {iconPosition === 'start' && iconElement}
      {children}
      {iconPosition === 'end' && iconElement}
    </button>
  );
}
`,"components/Field/Field.tsx":`import type { ReactNode } from 'react';
import { cx } from '@/lib/cx';

export interface FieldProps {
  id: string;
  label: string;
  help?: string;
  error?: string;
  children: ReactNode;
}

/** F\xE6lles ramme for formularfelter: synlig label, evt. hj\xE6lpetekst og fejlbesked. */
export function Field({ id, label, help, error, children }: FieldProps) {
  return (
    <div className={cx('form-field', error && 'has-error')}>
      <label className="form-label text-sm" htmlFor={id}>
        {label}
      </label>
      {help && (
        <p id={\`\${id}-help\`} className="form-help text text-sm style-normal">
          {help}
        </p>
      )}
      {children}
      {error && (

`,"components/Modal/Modal.tsx":`import { useEffect, useRef, useState, type MouseEvent, type ReactNode, type RefObject } from 'react';
import { createPortal } from 'react-dom';
import { cx } from '@/lib/cx';
import { Icon } from '@/components/Icon/Icon';

export interface ModalProps {
  open: boolean;
  onClose: () => void;
  /** Id p\xE5 modalens overskrift. */
  labelledBy: string;
  children: ReactNode;
  /** Giver adgang til det omr\xE5de, der scroller, fx for at rulle til toppen. */
  contentRef?: RefObject<HTMLDivElement | null>;
  className?: string;
}

const FOCUSABLE =
  'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

/**
 * Modal, der er forankret i toppen, s\xE5 den ikke flytter sig, n\xE5r indholdet vokser.
 * Indholdet scroller inde i modalen. Fokus holdes i modalen, Escape og klik udenfor lukker,
 * og fokus vender tilbage til knappen, der \xE5bnede den.
 */
export function Modal({ open, onClose, labelledBy, children, contentRef, className }: ModalProps) {
  const [mounted, setMounted] = useState(false);
  const dialogRef = useRef<HTMLDivElement>(null);
  const closeRef = useRef<HTMLButtonElement>(null);
  const pressedOnBackdrop = useRef(false);
  const onCloseRef = useRef(onClose);

  useEffect(() => {
    onCloseRef.current = onClose;
  });

  useEffect(() => setMounted(true), []);

  useEffect(() => {
    if (!open || !mounted) return;
    const previousFocus = document.activeElement as HTMLElement | null;
    document.body.classList.add('modal-open');
    closeRef.current?.focus();

    const handleKeyDown = (event: KeyboardEvent) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        onCloseRef.current();
      } else if (event.key === 'Tab') {
        keepFocusInside(event, dialogRef.current);
      }
    };
    document.addEventListener('keydown', handleKeyDown);

    return () => {
      document.removeEventListener('keydown', handleKeyDown);
      document.body.classList.remove('modal-open');
      previousFocus?.focus();
    };
  }, [open, mounted]);

  if (!mounted || !open) return null;

  // Luk kun, n\xE5r b\xE5de tryk og slip sker p\xE5 baggrunden (ikke n\xE5r man tr\xE6kker en markering ud af modalen)
  const handleMouseDown = (event: MouseEvent<HTMLDivElement>) => {
    pressedOnBackdrop.current = event.target === event.currentTarget;
  };
  const handleClick = (event: MouseEvent<HTMLDivElement>) => {
    if (pressedOnBackdrop.current && event.target === event.currentTarget) onClose();
  };

  return createPortal(
    <div className="modal-backdrop" onMouseDown={handleMouseDown} onClick={handleClick}>
      <div ref={dialogRef} className={cx('modal', className)} role="dialog" aria-modal="true" aria-labelledby={labelledBy}>
        <button ref={closeRef} type="button" className="modal__close" aria-label="Luk" onClick={onClose}>
          <Icon name="button-close" size="large" />
        </button>
        <div ref={contentRef} className="modal__content">
          {children}
        </div>
      </div>
    </div>,
    document.body,
  );
}

function keepFocusInside(event: KeyboardEvent, root: HTMLElement | null) {
  if (!root) return;
  const focusable = Array.from(root.querySelectorAll<HTMLElement>(FOCUSABLE)).filter(
    (element) => element.offsetParent !== null,
  );
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  const active = document.activeElement;

  if (!root.contains(active)) {
    event.preventDefault();
    first.focus();
  } else if (event.shiftKey && active === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault();
    first.focus();
  }
}

`,"components/Tabs/Tabs.tsx":`import { useRef, type KeyboardEvent, type ReactNode } from 'react';
import { cx } from '@/lib/cx';

export interface TabItem {
  id: string;
  label: string;
}

export interface TabsProps {
  items: ReadonlyArray<TabItem>;
  activeId: string;
  onChange: (id: string) => void;
  /** Pr\xE6fiks til id'er, s\xE5 fanerne kan kobles til deres TabPanel. */
  idPrefix?: string;
  label: string;
  className?: string;
}

export const tabId = (prefix: string, id: string) => \`\${prefix}-tab-\${id}\`;
export const panelId = (prefix: string, id: string) => \`\${prefix}-panel-\${id}\`;

/** Faner, der skifter indhold p\xE5 samme side (role="tablist"). Piletasterne flytter mellem fanerne. */
export function Tabs({ items, activeId, onChange, idPrefix = 'tabs', label, className }: TabsProps) {
  const tabRefs = useRef<Array<HTMLButtonElement | null>>([]);

  const handleKeyDown = (event: KeyboardEvent<HTMLButtonElement>, index: number) => {
    const last = items.length - 1;
    const next =
      event.key === 'ArrowRight' ? (index === last ? 0 : index + 1)
      : event.key === 'ArrowLeft' ? (index === 0 ? last : index - 1)
      : event.key === 'Home' ? 0
      : event.key === 'End' ? last
      : -1;
    if (next < 0) return;
    event.preventDefault();
    onChange(items[next].id);
    tabRefs.current[next]?.focus();
  };

  return (
    <div className={cx('tabs', className)} role="tablist" aria-label={label}>
      {items.map((item, index) => {
        const active = item.id === activeId;
        return (
          <button
            key={item.id}
            ref={(element) => {
              tabRefs.current[index] = element;
            }}
            type="button"
            role="tab"
            id={tabId(idPrefix, item.id)}
            aria-selected={active}
            aria-controls={panelId(idPrefix, item.id)}
            tabIndex={active ? 0 : -1}
            className={cx('tabs__tab', 'text-md', active && 'is-active')}
            onClick={() => onChange(item.id)}
            onKeyDown={(event) => handleKeyDown(event, index)}
          >
            {item.label}
          </button>
        );
      })}
    </div>
  );
}

export interface TabPanelProps {
  id: string;
  activeId: string;
  idPrefix?: string;
  children: ReactNode;
}

/** Indholdet til \xE9n fane. Skjulte faner bliver i DOM'en, s\xE5 udfyldte felter bevares. */
export function TabPanel({ id, activeId, idPrefix = 'tabs', children }: TabPanelProps) {
  return (
    <section
      role="tabpanel"
      id={panelId(idPrefix, id)}
      aria-labelledby={tabId(idPrefix, id)}
      hidden={id !== activeId}
      className="tab-panel"
    >
      {children}
    </section>
  );
}

`,"components/VolunteerInfoModal/VolunteerInfoModal.tsx":`import { useRef, useState } from 'react';
import { Heading } from '@/components/Heading/Heading';
import { Modal } from '@/components/Modal/Modal';
import { TabPanel, Tabs } from '@/components/Tabs/Tabs';
import { fullName, type PersonalInfo, type Volunteer, type VolunteerRole } from '@/lib/types';
import { CoursesTab } from './CoursesTab';
import { PersonalInfoTab } from './PersonalInfoTab';
import { VolunteerInfoTab } from './VolunteerInfoTab';

export type VolunteerInfoTabId = 'person' | 'frivillig' | 'kurser';

const TABS = [
  { id: 'person', label: 'Personoplysninger' },
  { id: 'frivillig', label: 'Frivilligoplysninger' },
  { id: 'kurser', label: 'Kurser' },
] as const satisfies ReadonlyArray<{ id: VolunteerInfoTabId; label: string }>;

const TITLE_ID = 'volunteer-info-title';
const TABS_ID = 'volunteer-info';

export interface VolunteerInfoModalProps {
  /** Modalen er \xE5ben, n\xE5r der er valgt en frivillig. */
  volunteer: Volunteer | null;
  onClose: () => void;
  onSavePersonal: (volunteerId: string, personal: PersonalInfo) => void;
  onSaveRole: (volunteerId: string, role: VolunteerRole) => void;
  onSetLeave?: (volunteerId: string, roleId: string) => void;
  onChangeRole?: (volunteerId: string, roleId: string) => void;
  /** Fanen, modalen \xE5bner p\xE5. Standard: Frivilligoplysninger. */
  initialTab?: VolunteerInfoTabId;
}

/** Modalen "Oplysninger om frivillig" fra listen over frivillige i en aktivitet. */
export function VolunteerInfoModal({ volunteer, onClose, ...rest }: VolunteerInfoModalProps) {
  const contentRef = useRef<HTMLDivElement>(null);

  return (
    <Modal open={volunteer !== null} onClose={onClose} labelledBy={TITLE_ID} contentRef={contentRef}>
      {volunteer && (
        // key: formularer og valgt fane starter forfra for hver frivillig
        <VolunteerInfoContent
          key={volunteer.id}
          volunteer={volunteer}
          onClose={onClose}
          onTabChange={() => contentRef.current?.scrollTo({ top: 0 })}
          {...rest}
        />
      )}
    </Modal>
  );
}

interface VolunteerInfoContentProps extends Omit<VolunteerInfoModalProps, 'volunteer'> {
  volunteer: Volunteer;
  onTabChange: () => void;
}

function VolunteerInfoContent({
  volunteer,
  onClose,
  onSavePersonal,
  onSaveRole,
  onSetLeave,
  onChangeRole,
  initialTab = 'frivillig',
  onTabChange,
}: VolunteerInfoContentProps) {
  const [activeTab, setActiveTab] = useState<VolunteerInfoTabId>(initialTab);

  const changeTab = (id: string) => {
    setActiveTab(id as VolunteerInfoTabId);
    onTabChange();
  };

  return (
    <>
      <Heading level={2} size="xl" id={TITLE_ID} className="volunteer-info__title">
        Oplysninger om {fullName(volunteer.personal)}
      </Heading>

      <Tabs items={TABS} activeId={activeTab} onChange={changeTab} idPrefix={TABS_ID} label="Oplysninger om den frivillige" />

      <TabPanel id="person" activeId={activeTab} idPrefix={TABS_ID}>
        <PersonalInfoTab personal={volunteer.personal} onSave={(personal) => onSavePersonal(volunteer.id, personal)} />
      </TabPanel>

      <TabPanel id="frivillig" activeId={activeTab} idPrefix={TABS_ID}>
        <VolunteerInfoTab
          volunteer={volunteer}
          onSaveRole={(role) => onSaveRole(volunteer.id, role)}
          onSetLeave={onSetLeave && ((roleId) => onSetLeave(volunteer.id, roleId))}
          onChangeRole={onChangeRole && ((roleId) => onChangeRole(volunteer.id, roleId))}
        />
      </TabPanel>

      <TabPanel id="kurser" activeId={activeTab} idPrefix={TABS_ID}>
        <CoursesTab courses={volunteer.courses} onClose={onClose} />
      </TabPanel>
    </>
  );
}
`,"components/VolunteerInfoModal/VolunteerInfoTab.tsx":`import { Heading } from '@/components/Heading/Heading';
import { InfoList } from '@/components/InfoList/InfoList';
import { Text } from '@/components/Text/Text';
import type { Volunteer, VolunteerRole } from '@/lib/types';
import { RoleItem } from './RoleItem';

export interface VolunteerInfoTabProps {
  volunteer: Volunteer;
  onSaveRole: (role: VolunteerRole) => void;
  onSetLeave?: (roleId: string) => void;
  onChangeRole?: (roleId: string) => void;
}

/** Fanen "Frivilligoplysninger": den frivilliges roller og generelle oplysninger. */
export function VolunteerInfoTab({ volunteer, onSaveRole, onSetLeave, onChangeRole }: VolunteerInfoTabProps) {
  const { roles, general } = volunteer;

  return (
    <>
      <Heading level={3} size="md" className="volunteer-info__section-title">
        Den frivilliges roller
      </Heading>
      {roles.length === 0 ? (
        <Text>Den frivillige har ingen roller i aktiviteten.</Text>
      ) : (
        <div className="role-list">
          {roles.map((role) => (
            <RoleItem key={role.id} role={role} onSave={onSaveRole} onSetLeave={onSetLeave} onChangeRole={onChangeRole} />
          ))}
        </div>
      )}

      <Heading level={3} size="md" className="volunteer-info__section-title">
        Generelle frivilligoplysninger
      </Heading>
      <InfoList
        items={[
          { term: 'Startdato i R\xF8de Kors:', value: general.redCrossStartDate },
          { term: 'Anciennitet:', value: general.seniority },
          { term: 'Godkendt R\xF8de Kors-aftalen:', value: general.agreementApproved },
          { term: 'B\xF8rneattest indhentningsdato:', value: general.childCertificateDate },
          { term: 'ID-kort udstedelsesdato:', value: general.idCardIssuedDate },
        ]}
      />
    </>
  );
}

export function cx(...values: Array<string | false | null | undefined>): string {
  return values.filter(Boolean).join(' ');
}

  margin-bottom: var(--rk-s-6);
  overflow-x: auto;
  border-bottom: 1px solid var(--rk-border);
}

.tabs__tab {
  padding: 8px 0 10px;
  font-family: inherit;
  line-height: 1.5;
  color: var(--rk-text);
  text-decoration: none;
  white-space: nowrap;
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  cursor: pointer;

  &:hover { color: var(--rk-text); }
  &:focus-visible { outline-offset: -2px; }

  &.is-active {
    color: var(--rk-primary);
    font-weight: 700;
    border-bottom-color: var(--rk-primary);
  }
}
`,"styles/components/_volunteer-info.scss":`// Modalen "Oplysninger om frivillig"
.volunteer-info__title         { margin-bottom: var(--rk-s-5); }
.volunteer-info__section-title { margin: var(--rk-s-5) 0 var(--rk-s-4); }
.volunteer-info__subheading    { margin: var(--rk-s-5) 0 var(--rk-s-2); }
.volunteer-info__actions       { margin-top: var(--rk-s-5); }

// Rolle med "Vis info" / "Skjul info"
.role-item { border-bottom: 1px solid var(--rk-border); }

.role-item__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rk-s-4);
  padding: var(--rk-s-3) 0;
  color: var(--rk-text-muted);
}

.role-item__toggle {
  min-width: 128px;

  .icon { transition: transform .2s; }
  &[aria-expanded='true'] .icon { transform: rotate(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .icon { transition: none; }
  }
}

.role-item__panel {
  padding: var(--rk-s-2) 0 var(--rk-s-5);

  .form-field { margin-bottom: var(--rk-s-4); }
}

.role-item__text { margin-bottom: var(--rk-s-4); }
